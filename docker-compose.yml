services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-documind}
      POSTGRES_USER: ${DB_USERNAME:-documind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-documind}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-documind} -d ${DB_NAME:-documind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: documind-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-documind}
      DB_USERNAME: ${DB_USERNAME:-documind}
      DB_PASSWORD: ${DB_PASSWORD:-documind}
      # Ollama runs on the host machine, not in Docker.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONT_PORT:-3000}
    extra_hosts:
      # Makes host.docker.internal work on Linux too (Docker Desktop provides it already).
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./Front
    container_name: documind-frontend
    depends_on:
      - backend
    ports:
      - "${FRONT_PORT:-3000}:80"

volumes:
  postgres-data:
